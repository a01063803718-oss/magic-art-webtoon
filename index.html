<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>MAGIC ART</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="reader-head">
  <button id="menuBtn" aria-label="메뉴">☰</button>
  <div>
    <div class="brand">MAGIC ART</div>
    <div class="ep">EP. 01 마법의 세계</div>
  </div>
  <button id="themeBtn" aria-label="화면 모드">◐</button>
</header>

<aside id="drawer">
  <div class="drawer-title">MAGIC ART</div>

  <button id="continueBtn" class="drawer-action" type="button">
    <span class="drawer-action-title">이어보기</span>
    <span id="continueMeta" class="drawer-action-meta">저장된 위치 없음</span>
  </button>

  <div class="drawer-action bookmark-art-panel">
    <span class="drawer-action-title">내 책갈피</span>

    <button id="bookmarkJumpBtn" class="bookmark-main-card" type="button">
      <span class="bookmark-main-frame">
        <img id="bookmarkArtImage" src="bookmark-art-01.jpg" alt="선택한 책갈피 작품">
        <span id="bookmarkArtScene">아직 저장된 책갈피가 없습니다</span>
      </span>
    </button>

    <span class="bookmark-picker-title">책갈피 그림 선택</span>
    <div id="bookmarkArtPicker" class="bookmark-art-picker"></div>
    <span id="bookmarkMeta" class="drawer-action-meta">작품을 탭하면 이 그림으로 책갈피가 고정됩니다.</span>
  </div>

  <a href="#cover">표지</a>
  <a href="#story">EP. 01 마법의 세계</a>
  <a href="#credits">크레딧</a>
</aside>
<div id="backdrop"></div>

<main id="comic">
  <section id="cover" class="cover">
    <img class="cover-image" src="cover-art.png" alt="MAGIC ART 마법의 미술 도구함 커버 아트">
  </section>

  <section id="story" class="story"></section>

  <section id="credits" class="credits">
    <div class="credits-title">CREDITS</div>
    <p><b>글</b> 이헌</p>
    <p><b>그림</b> 루이(AI)</p>
    <p><b>작품</b> 마지윤 · 박시연 · 주은우 · 이헌</p><p class="character-map"><b>등장인물</b> 지윤(에블린) · 시연(미아) · 은우(루크) · 헌(헌)</p>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
