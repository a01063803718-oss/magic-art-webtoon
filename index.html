<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>Magic Art Webtoon</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <button id="menuBtn" class="icon-btn" aria-label="메뉴">☰</button>
    <div class="title-wrap">
      <div class="series-title">MAGIC ART</div>
      <div class="episode-title" id="episodeTitle">EP. 01 마법의 세계</div>
    </div>
    <button id="themeBtn" class="icon-btn" aria-label="화면 모드">◐</button>
  </header>

  <aside id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-head">
      <strong>에피소드</strong>
      <button id="closeDrawer" class="icon-btn" aria-label="닫기">×</button>
    </div>
    <nav id="episodeList" class="episode-list"></nav>
  </aside>
  <div id="backdrop" class="backdrop" hidden></div>

  <main id="reader" class="reader" aria-live="polite"></main>

  <button id="topBtn" class="top-btn" aria-label="맨 위로">↑</button>

  <template id="sceneTemplate">
    <section class="scene">
      <div class="scene-visual">
        <div class="image-placeholder">
          <span class="scene-no"></span>
          <span class="placeholder-label"></span>
        </div>
      </div>
      <div class="scene-text"></div>
    </section>
  </template>

  <script src="app.js"></script>
</body>
</html>
